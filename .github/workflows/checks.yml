# Builds, tests, and checks every push to main and every pull request.
# Pull requests must add a changeset, except Dependabot updates of workflows.
# Pushes to main with pending changesets dispatch the release workflow for the
# checked commit.

name: Checks 🧐

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

run-name: >
  ${{
    format(
      '{0} {1}',
      github.workflow,
      github.event_name == 'pull_request'
        && format('PR#{0} "{1}"', github.event.pull_request.number, github.event.pull_request.title)
        || format('Branch {0} "{1}"', github.ref_name, github.event.head_commit.message)
    )
  }}

concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: >
    ${{
      format(
        '{0}--{1}',
        github.workflow,
        github.event_name == 'pull_request'
          && github.event.pull_request.number
          || github.ref_name
      )
    }}

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has-changesets: ${{ steps.has-changesets.outputs.result }}
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # the parent of a pull request's merge commit is needed to find added changesets
          fetch-depth: 2
          persist-credentials: false

      - name: 🚚 Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 👷 Build
        run: pnpm run each:build

      - name: 👨‍🔬 Tests
        run: pnpm run test

      - name: 👨‍🏫 Checks
        run: pnpm run each:check && pnpm run check

      - name: 📘 Docs
        run: pnpm run docs

      - name: 📄 Check for Changesets
        id: has-changesets
        run: |
          set -euo pipefail
          result=$([[ -d .changeset ]] && find .changeset -type f -name '*.md' -print -quit | grep -q . && echo true || echo false)
          echo "result=${result}" >> "$GITHUB_OUTPUT"

      - name: 👮‍♂️ Pull Requests Must Add Changesets
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          # HEAD is the merge commit of the pull request, its first parent the base branch
          base='HEAD^1'

          if git diff --name-only --diff-filter=A "$base" HEAD -- '.changeset/*.md' | grep -q .; then
            echo 'Changeset found.'
            exit 0
          fi

          # Dependabot updates of workflows need no release.
          if [[ "$PR_AUTHOR" == 'dependabot[bot]' ]] \
            && ! git diff --name-only "$base" HEAD | grep -qvE '^\.github/workflows/.+'; then
            echo 'Dependabot pull request changes only workflows; no changeset required.'
            exit 0
          fi

          echo "::error title=Missing Changeset::Pull requests must add changesets."
          exit 1

  dispatch-release:
    needs: checks
    if: >
      github.event_name == 'push' &&
      needs.checks.outputs.has-changesets == 'true'
    runs-on: ubuntu-latest
    permissions:
      # required to create a repository dispatch event with GITHUB_TOKEN
      contents: write
    steps:
      - name: '🎉 Workflow: Release (Event)'
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          event-type: workflow:release
          client-payload: >
            ${{
              format(
                '{{ "ref": {0}, "sha": {1} }}',
                toJson(github.ref_name),
                toJson(github.sha)
              )
            }}
