# Builds, tests, and checks every push to main and every pull request.
# Pull requests must add a changeset, except Dependabot updates of workflows.
# Pushes to main with pending changesets dispatch the release workflow for the
# checked commit.

name: Checks 🧐

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

run-name: >
  ${{
    format(
      '{0} {1}',
      github.workflow,
      github.event_name == 'pull_request'
        && format('PR#{0} "{1}"', github.event.pull_request.number, github.event.pull_request.title)
        || format('Branch {0} "{1}"', github.ref_name, github.event.head_commit.message)
    )
  }}

concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: >
    ${{
      format(
        '{0}--{1}',
        github.workflow,
        github.event_name == 'pull_request'
          && github.event.pull_request.number
          || github.ref_name
      )
    }}

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has-changesets: ${{ steps.has-changesets.outputs.result }}
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the parent of a pull request's merge commit is needed to find added changesets
          fetch-depth: 2
          persist-credentials: false

      - name: 🚚 Setup pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true

      - name: 👷 Build
        run: pnpm run each:build

      - name: 👨‍🔬 Tests
        run: pnpm run test

      - name: 👨‍🏫 Checks
        run: pnpm run each:check && pnpm run check

      - name: 📘 Docs
        run: pnpm run docs

      - name: 📄 Check for Changesets
        id: has-changesets
        run: |
          set -euo pipefail
          result=$([[ -d .changeset ]] && find .changeset -type f -name '*.md' -print -quit | grep -q . && echo true || echo false)
          echo "result=${result}" >> "$GITHUB_OUTPUT"

      - name: 👮‍♂️ Pull Requests Must Add Changesets
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.draft == false
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          # HEAD is the merge commit of the pull request, its first parent the base branch
          base='HEAD^1'

          if git diff --name-only --diff-filter=A "$base" HEAD -- '.changeset/*.md' | grep -q .; then
            echo 'Changeset found.'
            exit 0
          fi

          # Dependabot updates of workflows need no release.
          if [[ "$PR_AUTHOR" == 'dependabot[bot]' ]] \
            && ! git diff --name-only "$base" HEAD | grep -qvE '^\.github/workflows/.+'; then
            echo 'Dependabot pull request changes only workflows; no changeset required.'
            exit 0
          fi

          echo "::error title=Missing Changeset::Pull requests must add changesets."
          exit 1

  dispatch-release:
    needs: checks
    if: >
      github.event_name == 'push' &&
      github.ref_name == 'main' &&
      needs.checks.outputs.has-changesets == 'true'
    runs-on: ubuntu-latest
    permissions:
      # required to dispatch a workflow with GITHUB_TOKEN
      actions: write
    steps:
      - name: '🎉 Workflow: Release'
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # Passes the checked commit, which the release builds, and names the
          # run after it: short SHA and the first line of its message.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            --field sha="$GITHUB_SHA" \
            --field commit="${GITHUB_SHA:0:7}" \
            --field subject="${MESSAGE%%$'\n'*}"
