# Builds and packs the workspace of a release tag <name>/v<version> and
# publishes a complete GitHub release with the tarball and its checksum, for
# every workspace, private ones included. The release is published with the app
# token, so that it triggers the publish workflow. Only packages-changelog
# releases become the latest release.

name: GitHub Release 🎁

on:
  push:
    tags:
      # package names may contain a scope, so tags contain one or two slashes
      - '**/v*.*.*'
  workflow_dispatch:
    inputs:
      name:
        description: 'Package name (e.g. "@simbo/my-pkg")'
        type: string
        required: true
      version:
        description: 'Version (e.g. "1.2.3")'
        type: string
        required: true

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('{0}/v{1}', inputs.name, inputs.version) || github.ref_name }}

run-name: >
  ${{ format('{0} {1}', github.workflow,
    github.event_name == 'workflow_dispatch'
      && format('{0}/v{1}', inputs.name, inputs.version) || github.ref_name) }}

concurrency:
  cancel-in-progress: false
  group: >
    ${{ format('{0}--{1}', github.workflow,
      github.event_name == 'workflow_dispatch'
        && format('{0}/v{1}', inputs.name, inputs.version) || github.ref_name) }}

permissions: {}

jobs:
  github-release:
    runs-on: ubuntu-latest
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    steps:
      - name: 🛎️ Checkout Release Tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: 🚚 Setup pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true

      - name: 🧾 Validate Package Identity
        id: package
        run: |
          set -euo pipefail
          pnpm exec turbo run build --filter='@simbo/monorepo-utils'
          node scripts/release-package.js metadata "$RELEASE_TAG"

      - name: 👷 Build Package
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: pnpm exec turbo run build --filter="$PACKAGE_NAME"

      - name: 📦 Pack and Verify Release Archive
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          ASSET_NAME: ${{ steps.package.outputs.asset }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/package-release"
          pnpm --filter="$PACKAGE_NAME" pack --out "$RUNNER_TEMP/package-release/$ASSET_NAME"
          (cd "$RUNNER_TEMP/package-release" && sha256sum "$ASSET_NAME" > SHA256SUMS)
          node scripts/release-package.js verify "$RELEASE_TAG" "$RUNNER_TEMP/package-release"

      - name: 📝 Prepare Release Notes
        env:
          PACKAGE_DIR: ${{ steps.package.outputs.dir }}
        run: node scripts/release-notes.js

      - name: 🔑 Get App Token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.SIMBO_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.SIMBO_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write

      # Creates a draft, uploads the assets, and publishes the release only when
      # it is complete. A re-run after publishing ends without changes.
      - name: 🎁 Create GitHub Release
        uses: simbo-actions/staged-release@8092ba118ec7bd953c1193bafb597886f54f2f9d # v1.0.4
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag: ${{ env.RELEASE_TAG }}
          name: ${{ steps.package.outputs.name }} v${{ steps.package.outputs.version }}
          working-directory: ${{ runner.temp }}/package-release
          body-file: RELEASE_NOTES.md
          assets: |
            ${{ steps.package.outputs.asset }}
            SHA256SUMS
          make-latest: ${{ steps.package.outputs.name == 'packages-changelog' && 'true' || 'false' }}
          if-released: skip
