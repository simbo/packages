name: GitHub Release 🎁

on:
  push:
    tags:
      - '*/v*.*.*'
      - '!changelog/v*'
  workflow_dispatch:
    inputs:
      workspace:
        description: 'Workspace folder (e.g. "my-pkg")'
        type: string
        required: true
      version:
        description: 'Version (e.g. "1.2.3")'
        type: string
        required: true

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('{0}/v{1}', inputs.workspace, inputs.version) || github.ref_name }}

run-name: >
  ${{ format('{0} {1}', github.workflow,
    github.event_name == 'workflow_dispatch'
      && format('{0}/v{1}', inputs.workspace, inputs.version) || github.ref_name) }}

concurrency:
  cancel-in-progress: false
  group: >
    ${{ format('{0}--{1}', github.workflow,
      github.event_name == 'workflow_dispatch'
        && format('{0}/v{1}', inputs.workspace, inputs.version) || github.ref_name) }}

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - name: 🪪 Retrieve Credentials
        id: credentials
        uses: simbo-actions/actions/actions/github-app-credentials@main
        with:
          app-id: ${{ secrets.SIMBO_GITHUB_APP_ID }}
          app-private-key: ${{ secrets.SIMBO_GITHUB_APP_PRIVATE_KEY }}

      - name: 🛎️ Checkout Release Tag
        uses: actions/checkout@v6
        with:
          token: ${{ steps.credentials.outputs.token }}
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: 🚚 Install pnpm
        uses: pnpm/action-setup@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          token: ${{ steps.credentials.outputs.token }}
          cache: pnpm

      - name: 🧾 Validate Package Identity
        id: package
        run: node scripts/release-package.js metadata "$RELEASE_TAG"

      - name: 🔒 Skip Private Package
        if: ${{ steps.package.outputs.private == 'true' }}
        run: echo '::notice title=Private Package::Skipping GitHub release for a private workspace.'

      - name: 📦 Install Dependencies
        if: ${{ steps.package.outputs.private == 'false' }}
        run: pnpm install --frozen-lockfile

      - name: 👷 Build Package
        if: ${{ steps.package.outputs.private == 'false' }}
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        run: pnpm exec turbo run build --filter="$PACKAGE_NAME"

      - name: 📦 Pack and Verify Release Archive
        if: ${{ steps.package.outputs.private == 'false' }}
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          ASSET_NAME: ${{ steps.package.outputs.asset }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/package-release"
          pnpm --filter="$PACKAGE_NAME" pack --out "$RUNNER_TEMP/package-release/$ASSET_NAME"
          (cd "$RUNNER_TEMP/package-release" && sha256sum "$ASSET_NAME" > SHA256SUMS)
          node scripts/release-package.js verify "$RELEASE_TAG" "$RUNNER_TEMP/package-release"

      - name: 📝 Prepare Release Notes
        if: ${{ steps.package.outputs.private == 'false' }}
        run: node scripts/release-notes.js

      - name: 🎁 Upload Complete Draft Release
        id: release
        if: ${{ steps.package.outputs.private == 'false' }}
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          name: ${{ steps.package.outputs.name }} v${{ steps.package.outputs.version }}
          bodyFile: ${{ runner.temp }}/package-release/RELEASE_NOTES.md
          artifacts: ${{ runner.temp }}/package-release/${{ steps.package.outputs.asset }},${{ runner.temp }}/package-release/SHA256SUMS
          artifactErrorsFailBuild: true
          draft: true
          allowUpdates: true
          updateOnlyUnreleased: true
          skipIfReleaseExists: true
          makeLatest: true
          token: ${{ steps.credentials.outputs.token }}

      - name: 🚀 Publish Ready GitHub Release
        if: ${{ steps.release.outputs.id != '' }}
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        with:
          github-token: ${{ steps.credentials.outputs.token }}
          script: |
            const releaseId = Number(process.env.RELEASE_ID);
            if (!Number.isSafeInteger(releaseId) || releaseId <= 0) {
              core.setFailed('Invalid Release ID: Cannot publish the prepared draft.');
              return;
            }
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: releaseId,
              draft: false,
              make_latest: 'true',
            });
