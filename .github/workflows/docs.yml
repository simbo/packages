# Builds the TypeDoc pages of a release commit and deploys them to the gh-pages
# branch. Dispatched by the release workflow for every release commit; manual
# runs are skipped.

name: Docs 📘

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full SHA of the release commit (set by "Release")'
        required: false
        default: ''
      commit:
        description: 'Short SHA of the release commit (set by "Release")'
        required: false
        default: ''
      subject:
        description: 'Subject of the release commit (set by "Release")'
        required: false
        default: ''

run-name: >
  ${{
    inputs.commit != ''
      && format('{0} {1} "{2}"', github.workflow, inputs.commit, inputs.subject)
      || github.workflow
  }}

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}

permissions: {}

jobs:
  docs:
    # Only the dispatch by the release workflow deploys; a manual run is
    # skipped. A re-run keeps the actor of the original run.
    if: github.ref == 'refs/heads/main' && github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      # push to the gh-pages branch with GITHUB_TOKEN
      contents: write
    steps:
      - name: 🔎 Check the Commit
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid Commit::Expected the full SHA of the release commit."
            exit 1
          fi

      # Builds the release commit, not the current main.
      - name: 🛎️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: 🚚 Setup pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true

      - name: 👷‍♂️ Build Packages
        run: pnpm run each:build

      - name: 📘 Build Docs
        run: pnpm run docs

      - name: 🚚 Deploy Docs
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: docs
          branch: gh-pages
          clean: true
          single-commit: true
