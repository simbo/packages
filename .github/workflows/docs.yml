# Builds the TypeDoc pages and deploys them to the gh-pages branch, after each
# release commit or on manual request.

name: Docs 📘

on:
  repository_dispatch:
    types:
      - release-commit-created
  workflow_dispatch:
    inputs:
      ref:
        description: Ref
        required: false
        default: 'main'

run-name: >
  ${{
    format(
      '{0} {1}',
      github.workflow,
      github.event_name == 'repository_dispatch' && github.event.client_payload.ref || github.event.inputs.ref
    )
  }}

concurrency:
  cancel-in-progress: false
  group: >
    ${{
      format(
        '{0}--{1}',
        github.workflow,
        github.event_name == 'repository_dispatch' && github.event.client_payload.ref || github.event.inputs.ref
      )
    }}

permissions: {}

env:
  REF: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.ref || github.event.inputs.ref }}

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      # push to the gh-pages branch with GITHUB_TOKEN
      contents: write
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: 🚚 Setup pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          node-version-file: .nvmrc
          cache: true
          install: false

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 👷‍♂️ Build Packages
        run: pnpm run each:build

      - name: 📘 Build Docs
        run: pnpm run docs

      - name: 🚚 Deploy Docs
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: docs
          branch: gh-pages
          clean: true
          single-commit: true
