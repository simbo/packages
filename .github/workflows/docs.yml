# Builds the TypeDoc pages and deploys them to the gh-pages branch, after each
# release commit or on manual request.

name: Docs 📘

on:
  repository_dispatch:
    types:
      - release-commit-created
  workflow_dispatch:
    inputs:
      ref:
        description: Ref
        required: false
        default: 'main'

run-name: >
  ${{
    format(
      '{0} {1}',
      github.workflow,
      github.event_name == 'repository_dispatch' && github.event.client_payload.ref || github.event.inputs.ref
    )
  }}

concurrency:
  cancel-in-progress: false
  group: >
    ${{
      format(
        '{0}--{1}',
        github.workflow,
        github.event_name == 'repository_dispatch' && github.event.client_payload.ref || github.event.inputs.ref
      )
    }}

permissions: {}

env:
  REF: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.ref || github.event.inputs.ref }}

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      # push to the gh-pages branch with GITHUB_TOKEN
      contents: write
    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: 🚚 Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 👷‍♂️ Build Packages
        run: pnpm run each:build

      - name: 📘 Build Docs
        run: pnpm run docs

      - name: 🚚 Deploy Docs
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: docs
          branch: gh-pages
          clean: true
          single-commit: true
