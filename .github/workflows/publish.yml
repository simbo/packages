name: Publish 🚛

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      workspace:
        description: 'Workspace folder (e.g. "my-pkg")'
        type: string
        required: true
      version:
        description: 'Version (e.g. "1.2.3")'
        type: string
        required: true

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('{0}/v{1}', inputs.workspace, inputs.version) || github.event.release.tag_name }}

run-name: >
  ${{ format('{0} {1}', github.workflow,
    github.event_name == 'workflow_dispatch'
      && format('{0}/v{1}', inputs.workspace, inputs.version) || github.event.release.tag_name) }}

concurrency:
  cancel-in-progress: false
  group: >
    ${{ format('{0}--{1}', github.workflow,
      github.event_name == 'workflow_dispatch'
        && format('{0}/v{1}', inputs.workspace, inputs.version) || github.event.release.tag_name) }}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !startsWith(github.event.release.tag_name, 'changelog/')) }}
    runs-on: ubuntu-latest
    steps:
      - name: 🪪 Retrieve Credentials
        id: credentials
        uses: simbo-actions/actions/actions/github-app-credentials@main
        with:
          app-id: ${{ secrets.SIMBO_GITHUB_APP_ID }}
          app-private-key: ${{ secrets.SIMBO_GITHUB_APP_PRIVATE_KEY }}

      - name: 🛎️ Checkout Release Tag
        uses: actions/checkout@v6
        with:
          token: ${{ steps.credentials.outputs.token }}
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: 🚚 Install pnpm
        uses: pnpm/action-setup@v4

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          token: ${{ steps.credentials.outputs.token }}

      - name: 🧾 Validate Package Identity
        id: package
        run: node scripts/release-package.js metadata "$RELEASE_TAG"

      - name: 🔒 Skip Private Package
        if: ${{ steps.package.outputs.private == 'true' }}
        run: echo '::notice title=Private Package::Skipping npm publish for a private workspace.'

      - name: 📥 Download Published Release Archive
        if: ${{ steps.package.outputs.private == 'false' }}
        env:
          GH_TOKEN: ${{ steps.credentials.outputs.token }}
          GH_REPO: ${{ github.repository }}
          ASSET_NAME: ${{ steps.package.outputs.asset }}
          EXPECTED_RELEASE_ID: ${{ github.event.release.id }}
        run: |
          set -euo pipefail
          encoded_tag=$(node -p 'encodeURIComponent(process.env.RELEASE_TAG)')
          release=$(gh api "repos/$GH_REPO/releases/tags/$encoded_tag")
          if ! jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == false and .prerelease == false' <<< "$release" > /dev/null; then
            echo '::error title=Invalid GitHub Release::Expected a published stable release for the requested tag.'
            exit 1
          fi
          if [[ -n "$EXPECTED_RELEASE_ID" && "$(jq -r .id <<< "$release")" != "$EXPECTED_RELEASE_ID" ]]; then
            echo '::error title=Release Identity Changed::The release no longer matches the triggering event.'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/package-release"
          gh release download "$RELEASE_TAG" --pattern "$ASSET_NAME" --pattern SHA256SUMS --dir "$RUNNER_TEMP/package-release"

      - name: 🔐 Verify Archive Identity and Checksum
        if: ${{ steps.package.outputs.private == 'false' }}
        run: node scripts/release-package.js verify "$RELEASE_TAG" "$RUNNER_TEMP/package-release"

      - name: 🚛 Publish Verified Tarball to npm
        if: ${{ steps.package.outputs.private == 'false' }}
        env:
          ASSET_NAME: ${{ steps.package.outputs.asset }}
        run: pnpm publish "$RUNNER_TEMP/package-release/$ASSET_NAME" --no-git-checks --access public --provenance
