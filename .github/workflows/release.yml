# Applies pending changesets, commits the version bumps as a signed commit, and
# creates one tag per bumped package. The tags trigger the GitHub release
# workflow; the docs workflow is dispatched for the release commit afterwards.
# Dispatched by the checks workflow on main; manual runs are skipped. Releases
# only the commit that the checks workflow tested: main must still be at it.

name: Release 🏷️

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full SHA of the checked commit (set by "Checks")'
        required: false
        default: ''
      commit:
        description: 'Short SHA of the checked commit (set by "Checks")'
        required: false
        default: ''
      subject:
        description: 'Subject of the checked commit (set by "Checks")'
        required: false
        default: ''

run-name: >
  ${{
    inputs.commit != ''
      && format('{0} {1} "{2}"', github.workflow, inputs.commit, inputs.subject)
      || github.workflow
  }}

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}

permissions: {}

jobs:
  release:
    # Only the dispatch by the checks workflow releases; a manual run is
    # skipped. A re-run keeps the actor of the original run.
    if: github.ref == 'refs/heads/main' && github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      commit-sha: ${{ steps.commit.outputs.commit-sha }}
      tags: ${{ steps.bumped-packages.outputs.tags }}
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    steps:
      - name: 🔑 Get App Token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.SIMBO_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.SIMBO_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: 🛎️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      # Runs only code from main, and only the commit that the checks workflow
      # tested. If main has moved on, the release fails here, and the run for
      # the later commit takes over.
      - name: 🔎 Check the Commit
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Invalid Commit::Expected the full SHA of the checked commit."
            exit 1
          fi
          head="$(git rev-parse HEAD)"
          if [[ "$head" != "$SHA" ]]; then
            echo "::error title=Main Has Moved On::main is at ${head}, not at the checked commit ${SHA}."
            exit 1
          fi

      - name: 🚚 Setup pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true

      - name: 🔄 Integrate Changesets and Sync Versions
        run: |
          set -euo pipefail

          # changesets need a working prettier config, the bump detection needs monorepo-utils
          pnpm exec turbo run build --filter='@simbo/prettier-config' --filter='@simbo/monorepo-utils'

          # integrate changesets
          pnpm exec changeset version

          # update lockfile
          pnpm install

      # Temporary until simbo-actions/version-bumps exists; the script has the
      # same outputs: packages (JSON), tags, count.
      - name: 🧾 Get Bumped Packages
        id: bumped-packages
        run: node scripts/version-bumps.js HEAD

      - name: 📝 Update Packages List Docs
        run: pnpm run packages-list

      # Fails if main has moved since the checked commit, instead of releasing
      # unchecked changes. Tags are annotated, with the app as tagger and the
      # message "Release <tag>", and point to the new commit.
      - name: 💾 Commit Release and Create Tags
        id: commit
        uses: simbo-actions/signed-commit@df08ef72906d35d551448780cea85ef8aa2ac3cd # v2.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: main
          message: 'ci(release): ${{ steps.bumped-packages.outputs.tags }}'
          tags: ${{ steps.bumped-packages.outputs.tags }}
          tag-type: annotated
          tag-message: 'Release {tag}'
          sync: false

  dispatch-docs:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      # required to dispatch a workflow with GITHUB_TOKEN
      actions: write
    steps:
      - name: '📘 Workflow: Docs'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.release.outputs.commit-sha }}
          TAGS: ${{ needs.release.outputs.tags }}
        run: |
          set -euo pipefail
          # Passes the release commit and names the run after it: short SHA
          # and subject.
          gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main \
            --field sha="$SHA" \
            --field commit="${SHA:0:7}" \
            --field subject="ci(release): ${TAGS}"
