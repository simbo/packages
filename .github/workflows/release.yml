# Applies pending changesets, commits the version bumps as a signed commit, and
# creates one tag per bumped package. The tags trigger the GitHub release
# workflow; the docs workflow is dispatched afterwards.

name: Release 🏷️

on:
  repository_dispatch:
    types:
      - workflow:release
  workflow_dispatch:
    inputs:
      ref:
        description: Ref
        type: string
        required: true
        default: 'main'

run-name: >
  ${{
    format(
      '{0} Branch {1}',
      github.workflow,
      github.event_name == 'repository_dispatch' && github.event.client_payload.ref || github.event.inputs.ref
    )
  }}

concurrency:
  cancel-in-progress: false
  group: >
    ${{
      format(
        '{0}--{1}',
        github.workflow,
        github.event_name == 'repository_dispatch' && github.event.client_payload.ref || github.event.inputs.ref
      )
    }}

permissions: {}

env:
  REF: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.ref || github.event.inputs.ref }}
  # the commit checked by the checks workflow; manual runs release the head of REF
  SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || '' }}

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    steps:
      - name: 🔑 Get App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SIMBO_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.SIMBO_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: 🛎️ Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.SHA || env.REF }}
          persist-credentials: false

      - name: 🚚 Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: 🛠️ Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: 📦 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔄 Integrate Changesets and Sync Versions
        run: |
          set -euo pipefail

          # changesets need a working prettier config, therefor the prettier-config package needs to be build first
          pnpm exec turbo run build --filter='@simbo/prettier-config'

          # integrate changesets
          pnpm exec changeset version

          # update lockfile
          pnpm install

      - name: 🧾 Get Bumped Packages
        id: bumped-packages
        run: |
          set -euo pipefail

          # Get the names of changes files
          changedFiles=$(git diff --name-only HEAD)

          # Initialize an array of package versions for release
          packages=()

          # Loop through the changed files and check for package.json files.
          # Check if the package.json has a version change, extract the package folder name and version.
          # Join them with a slash and add it to the released packages list.
          for file in $changedFiles; do
            if [[ "$file" =~ ^packages/.+/package\.json$ ]]; then
              oldVersion=$(git show HEAD:"$file" | jq -r .version 2>/dev/null || echo)
              newVersion=$(jq -r .version "$file")
              if [[ -n "$oldVersion" && -n "$newVersion" && "$oldVersion" != "$newVersion" ]]; then
                pkgFolder=$(basename "$(dirname "$file")")
                packages+=("${pkgFolder}/v${newVersion}")
              fi
            fi
          done

          # Fail if no packages are found
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "::error title=No Packages Found::No packages were found to release."
            exit 1
          fi

          # Print and output the packages
          echo "packages=${packages[*]}"
          echo "packages=${packages[*]}" >> "$GITHUB_OUTPUT"

      - name: 📝 Update Packages List Docs
        run: pnpm run packages-list

      # Fails if REF has moved since the checked commit, instead of releasing
      # unchecked changes. Tags are lightweight and point to the new commit.
      - name: 💾 Commit Release and Create Tags
        uses: simbo-actions/signed-commit@98f498eda4eb29a405322d694b4fa17bb42fc40b # v1.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ env.REF }}
          message: 'ci(release): ${{ steps.bumped-packages.outputs.packages }}'
          tags: ${{ steps.bumped-packages.outputs.packages }}
          sync: false

      - name: 🎉 Release Commit Created (Event)
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          event-type: release-commit-created
          token: ${{ steps.app-token.outputs.token }}
          client-payload: >
            ${{
              format(
                '{{ "ref": {0}, "packages": {1} }}',
                toJson(env.REF),
                toJson(steps.bumped-packages.outputs.packages)
              )
            }}
