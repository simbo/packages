# Applies pending changesets, commits the version bumps as a signed commit, and
# creates one tag per bumped package. The tags trigger the GitHub release
# workflow; the docs workflow is dispatched afterwards.

name: Release 🏷️

on:
  repository_dispatch:
    types:
      - workflow:release
  workflow_dispatch:
    inputs:
      ref:
        description: Ref
        type: string
        required: true
        default: 'main'

run-name: >
  ${{
    format(
      '{0} Branch {1}',
      github.workflow,
      github.event_name == 'repository_dispatch' && github.event.client_payload.ref || github.event.inputs.ref
    )
  }}

concurrency:
  cancel-in-progress: false
  group: >
    ${{
      format(
        '{0}--{1}',
        github.workflow,
        github.event_name == 'repository_dispatch' && github.event.client_payload.ref || github.event.inputs.ref
      )
    }}

permissions: {}

env:
  REF: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.ref || github.event.inputs.ref }}
  # the commit checked by the checks workflow; manual runs release the head of REF
  SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || '' }}

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    steps:
      - name: 🔑 Get App Token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.SIMBO_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.SIMBO_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: 🛎️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA || env.REF }}
          persist-credentials: false

      - name: 🚚 Setup pnpm and Node.js
        uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          node-version-file: .nvmrc
          cache: true
          require-lockfile: true

      - name: 🔄 Integrate Changesets and Sync Versions
        run: |
          set -euo pipefail

          # changesets need a working prettier config, the bump detection needs monorepo-utils
          pnpm exec turbo run build --filter='@simbo/prettier-config' --filter='@simbo/monorepo-utils'

          # integrate changesets
          pnpm exec changeset version

          # update lockfile
          pnpm install

      # Temporary until simbo-actions/version-bumps exists; the script has the
      # same outputs: packages (JSON), tags, count.
      - name: 🧾 Get Bumped Packages
        id: bumped-packages
        run: node scripts/version-bumps.js HEAD

      - name: 📝 Update Packages List Docs
        run: pnpm run packages-list

      # Fails if REF has moved since the checked commit, instead of releasing
      # unchecked changes. Tags are lightweight and point to the new commit.
      - name: 💾 Commit Release and Create Tags
        uses: simbo-actions/signed-commit@98f498eda4eb29a405322d694b4fa17bb42fc40b # v1.0.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ env.REF }}
          message: 'ci(release): ${{ steps.bumped-packages.outputs.tags }}'
          tags: ${{ steps.bumped-packages.outputs.tags }}
          sync: false

      - name: 🎉 Release Commit Created (Event)
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          event-type: release-commit-created
          token: ${{ steps.app-token.outputs.token }}
          client-payload: >
            ${{
              format(
                '{{ "ref": {0}, "tags": {1} }}',
                toJson(env.REF),
                toJson(steps.bumped-packages.outputs.tags)
              )
            }}
