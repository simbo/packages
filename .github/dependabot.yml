version: 2

updates:
  # GitHub Actions in workflows, daily
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude:
        - simbo-actions/*
    groups:
      # Own actions in one pull request: a release often updates several
      simbo-actions:
        patterns:
          - simbo-actions/*
      # Trusted publishers, one pull request per update
      trusted-actions:
        group-by: dependency-name
        patterns:
          - actions/*
          - github/*
          - google/*
      # One pull request per update
      third-party-actions:
        group-by: dependency-name
        patterns:
          - '*'
        exclude-patterns:
          - simbo-actions/*
          - actions/*
          - github/*
          - google/*
